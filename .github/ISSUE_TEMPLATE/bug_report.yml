name: Bug report
description: Something in G's Avengers (Mac or Windows) does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - Mac app (menu-bar window, switcher, snapping, capture, Quick Ring...)
        - Clipboard history / emoji
        - Sharing (Windows keyboard & mouse on the Mac)
        - Windows app
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: G's Avengers version, macOS version, and Windows version if sharing is involved.
      placeholder: "1.0.0, macOS 26.1, Windows 11 24H2"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open G's Avengers
        2. ...
  - type: markdown
    attributes:
      value: Please do not paste passwords, private clipboard contents or your network addresses.
