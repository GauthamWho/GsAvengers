name: Feature request
description: Want something? Tell us and we'll build it
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like?
      description: Describe the habit, shortcut or feature, and why it would help you.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
